apiVersion: apps/v1
kind: Deployment
metadata: 
  name: profile
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: profile
  template:
    metadata:
      labels:
        app.kubernetes.io/name: profile 
    spec:
      affinity:       
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions: [{ key: app.kubernetes.io/name, operator: In, values: [profile] }]
                topologyKey: "kubernetes.io/hostname"
      containers: 
      - name: profile
        image: gulhermepsantos/profile.api:v1
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m" 
          limits:
            memory: "250Mi"
            cpu: "500m"
        ports:
          - containerPort: 7000
            name: profile-port
        envFrom:
        - configMapRef: 
            name: profile-env-config
  

