apiVersion: apps/v1
kind: Deployment
metadata: 
  name: profile
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: profile
  template:
    labels:
      app.kubernetes.io/name: profile 
    containers: 
    - name: profile
      image: gulhermepsantos/gulhermepsantos/profile.api:v1
      resources:
        requests:
          memory: 100Mi
          cpu: "100m"
        limits:
          memory: 250Mi
          cpu: "250m"
      ports:
      - containerPort: 7000


