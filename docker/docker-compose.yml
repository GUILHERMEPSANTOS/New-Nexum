version: "3.4"

networks:  
  new-newxum-networking: 
    external: true

services:
  keycloak: 
    image: ${DOCKER_REGISTRY-}/new-nexum-keycloak:${TAG}
    container_name: new-nexum-keycloak
    build:
      context: "./keycloak"
      dockerfile: "./Dockerfile"
    command: -v start-dev --import-realm --spi-theme-static-max-age=-1 --spi-theme-cache-themes=false --spi-theme-cache-templates=false
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/volume:/opt/keycloak/data/import
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost    
    restart: always      
    networks:
      - new-newxum-networking

  profile:
    image: ${DOCKER_REGISTRY-}/profile.api:${TAG}
    container_name: profile.api
    build: 
      context: "../backend/src"
      dockerfile: "./Services/Profile/NewNexum.Profile.Api/Dockerfile"
    ports:
      - "7000:7000"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:7000;            

